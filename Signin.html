<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="sign">
    <div class="auth-wrapper auth-reverse">
        <div class="auth-image"></div>
        <div class="auth-panel">
            <div class="auth-form-box">
                <h2 class="text-center mb-4">Signin</h2>
                <form id="SigninForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">ชื่อ-นามสกุล</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="tel" class="form-label">เบอร์โทรศัพท์</label>
                        <input type="tel" class="form-control" id="tel" name="tel" pattern="[0-9]{10}" maxlength="10" title="กรุณากรอกเบอร์โทร 10 หลัก" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">รหัสผ่าน</label>
                        <input type="password" class="form-control" id="password" name="password" minlength="8" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">ยืนยันสมัครสมาชิก</button>
                </form>
            </div>
        </div>
    </div>
 
    <script src="login.js"></script>
</body>
</html>
