            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav w-100">
                    <a class="nav-link" href="home.html">Home</a>
                    <a class="nav-link" href="Menu.html">Menu</a>
                    <a href="membership.php" class="nav-link active ms-auto me-2" aria-current="page">Membership</a>

    </nav>
    
    <header class="bg-dark text-white pb-2">
        <a class="nav-link back-link" href="membership.php">
            <i class="bi bi-chevron-left"></i> ย้อนกลับ
        </a>
        <div class="text-center pt-4 mb-0">
            <h1>ข้อมูลสมาชิก</h1>
            <h3>สวัสดี , คุณ <span id="member-name">...</span></h3>
        </div>
    </header>

    <section class="container my-5">
        <h3 class="text-center mb-2">ใช้คะแนนสะสมแลกของรางวัล</h3>
        <p class="text-center text-muted mb-4">
            คะแนนของคุณ : <b style="color: var(--clay-rose);"><span id="points">0</span> แต้ม</b>
        </p>

        <div id="redeem-alert"></div>

        <div class="row g-3" id="reward-grid">
            <div class="col-12 text-center text-muted">กำลังโหลด...</div>
        </div>
    </section>

    <div class="container text-center mt-4 mb-5">
        <h3>ประวัติการใช้คะแนน</h3>
        <div class="table-responsive mt-3">
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">รายการ</th>
                        <th scope="col">คะแนนที่ใช้</th>
                        <th scope="col">วัน/เวลา</th>
                        <th scope="col">สถานะคูปอง</th>
                    </tr>
                </thead>
                <tbody id="history-body">
                    <tr><td colspan="4" class="text-muted py-4">กำลังโหลด...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let myPoints = 0;
        let rewards = [];

        function showAlert(type, msg) {
            document.getElementById('redeem-alert').innerHTML =
                '<div class="alert alert-' + type + ' alert-dismissible fade show" role="alert">' + esc(msg) +
                '<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button></div>';
        }

        function renderRewards() {
            const grid = document.getElementById('reward-grid');
            if (!rewards.length) {
                grid.innerHTML = '<div class="col-12 text-center text-muted">ยังไม่มีของรางวัลให้แลกในตอนนี้</div>';
                return;
            }
            grid.innerHTML = rewards.map(r => {
                const stock = Number(r.stock);
                const cost  = Number(r.points);
                let label = 'แลก', disabled = false;
                if (stock === 0)            { label = 'หมดแล้ว';   disabled = true; }
                else if (myPoints < cost)   { label = 'ต้องการอีก ' + (cost - myPoints).toLocaleString('th-TH') + ' แต้ม'; disabled = true; }

                const stockText = stock === -1 ? '' : (stock === 0 ? 'ของหมด' : 'เหลือ ' + stock.toLocaleString('th-TH') + ' ชิ้น');
                return '<div class="col-6 col-md-4 col-lg-3">' +
                    '<div class="card h-100"><div class="card-body d-flex flex-column">' +
                        '<h5 class="card-title">' + esc(r.name) + '</h5>' +
                        '<p class="mb-1"><b>' + cost.toLocaleString('th-TH') + ' คะแนน</b></p>' +
                        '<p class="small text-muted mb-3">' + stockText + '</p>' +
                        '<div class="mt-auto"><button class="btn btn-primary w-100" data-id="' + r.id + '"' + (disabled ? ' disabled' : '') + '>' + label + '</button></div>' +
                    '</div></div></div>';
            }).join('');
        }

        async function loadRewards() {
            try {
                const json = await api('member_api.php?action=rewards');
                if (!json.success) throw new Error(json.message);
                rewards = json.data;
                renderRewards();
            } catch (err) {
                if (err.message !== 'unauthorized')
                    document.getElementById('reward-grid').innerHTML = '<div class="col-12 text-center text-danger">โหลดของรางวัลไม่สำเร็จ</div>';
            }
        }

        async function loadHistory() {
            const body = document.getElementById('history-body');
            try {
                const json = await api('member_api.php?action=redemptions');
                if (!json.success) throw new Error(json.message);
                if (!json.data.length) {
                    body.innerHTML = '<tr><td colspan="4" class="text-muted py-4">ยังไม่มีประวัติการใช้คะแนน</td></tr>';
                    return;
                }
                body.innerHTML = json.data.map(h =>
                    '<tr><td>' + esc(h.name) + '</td>' +
                    '<td>' + Number(h.points).toLocaleString('th-TH') + '</td>' +
                    '<td>' + fmtDate(h.created_at) + '</td>' +
                    '<td>' + (Number(h.used) ? '<span class="text-muted">ใช้แล้ว</span>' : '<span class="text-success">พร้อมใช้ตอนสั่งอาหาร</span>') + '</td></tr>'
                ).join('');
            } catch (err) {
                if (err.message !== 'unauthorized')
                    body.innerHTML = '<tr><td colspan="4" class="text-danger py-4">โหลดข้อมูลไม่สำเร็จ</td></tr>';
            }
        }

        document.getElementById('reward-grid').addEventListener('click', async e => {
            const btn = e.target.closest('button[data-id]');
            if (!btn || btn.disabled) return;
            const r = rewards.find(x => String(x.id) === btn.dataset.id);
            if (!r) return;
            if (!confirm('แลก "' + r.name + '" ด้วย ' + Number(r.points).toLocaleString('th-TH') + ' คะแนน ใช่หรือไม่?')) return;

            btn.disabled = true;           // กันกดซ้ำ
            try {
                const json = await api('member_api.php', { action: 'redeem', reward_id: r.id });
                showAlert(json.success ? 'success' : 'danger', json.message || (json.success ? 'สำเร็จ' : 'แลกไม่สำเร็จ'));
            } catch (err) {
                if (err.message !== 'unauthorized') showAlert('danger', 'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง');
            }
            // โหลดใหม่ทุกครั้ง เพื่อให้แต้ม/สต็อก/ประวัติตรงกับฐานข้อมูล
            try { myPoints = await loadProfile(); } catch (_) {}
            loadRewards();
            loadHistory();
        });

        async function refreshAll() {
            try { myPoints = await loadProfile(); } catch (_) {}
            await Promise.all([loadRewards(), loadHistory()]);
        }
        refreshAll();
        autoRefresh(refreshAll, 15000);
    </script>
</body>
</html>
